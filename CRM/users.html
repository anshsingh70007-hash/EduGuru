<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/crm/">
    
    <meta charset="utf-8">
    <title>Users & Roles | EducationistGuru CRM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/images/fav.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .role-card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:15px; display:flex; align-items:center; justify-content:space-between; transition:all .2s; }
        .role-card:hover { box-shadow:0 4px 15px rgba(0,0,0,.06); }
        .role-dot { width:12px; height:12px; border-radius:50%; margin-right:12px; flex-shrink:0; }
        .role-info { display:flex; align-items:center; flex:1; }
        .role-label { font-weight:700; font-size:15px; }
        .role-perms { font-size:12px; color:var(--text-muted); margin-top:3px; }
        .perm-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:15px; }
        .perm-checkbox { display:flex; align-items:center; gap:6px; font-size:13px; padding:8px 12px; background:#f8f9fa; border-radius:8px; cursor:pointer; }
        .perm-checkbox input { accent-color:#ff6b00; }
        .tab-nav { display:flex; border-bottom:2px solid var(--border); margin-bottom:25px; }
        .tab-nav button { padding:12px 25px; border:none; background:none; font-size:14px; font-weight:600; cursor:pointer; color:var(--text-muted); border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .2s; font-family:'Inter',sans-serif; }
        .tab-nav button.active { color:#ff6b00; border-bottom-color:#ff6b00; }
        .tab-content { display:none; }
        .tab-content.active { display:block; }
        .access-denied { text-align:center; padding:80px 20px; }
        .access-denied i { font-size:80px; color:#dc3545; margin-bottom:20px; }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><a href="dashboard.html"><img src="/images/logo-white.png" alt="EducationistGuru" class="sidebar-logo"></a><div class="brand-sub">CRM Dashboard</div></div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div class="sidebar-footer"><a href="#" onclick="logout()"><i class="fa fa-sign-out"></i> Sign Out</a></div>
        </aside>
        <div class="main-content">
            <div class="topbar">
                <div class="topbar-left">
                    <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fa fa-bars"></i></button>
                    <h1>Users & Roles</h1>
                </div>
                <div class="topbar-right">
                    <div class="admin-avatar">
                        <div id="topAvatar" style="width:36px;height:36px;border-radius:50%;background:#ff6b00;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;"></div>
                        <div><div class="admin-name" id="topName"></div><div class="admin-role" id="topRole"></div></div>
                    </div>
                </div>
            </div>
            <div class="page-content" id="pageContent"></div>
        </div>
    </div>

    <!-- Add/Edit User Modal -->
    <div class="modal-overlay" id="userModal">
        <div class="modal">
            <div class="modal-header"><h3 id="userModalTitle">Add New User</h3><button class="modal-close" onclick="closeUserModal()">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="userId">
                <div class="form-group"><label>Full Name</label><input type="text" id="userName" placeholder="Enter full name" required></div>
                <div class="form-group"><label>Email Address</label><input type="email" id="userEmail" placeholder="user@educationistguru.com" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="userPassword" placeholder="Minimum 6 characters"></div>
                <div class="form-group"><label>Phone Number</label><input type="text" id="userPhone" placeholder="+91 98765 43210"></div>
                <div class="form-group"><label>Role</label><select id="userRole"></select></div>
                <div class="form-group"><label>Status</label>
                    <select id="userStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeUserModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveUser()"><i class="fa fa-check"></i> Save User</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Role Modal -->
    <div class="modal-overlay" id="roleModal">
        <div class="modal">
            <div class="modal-header"><h3 id="roleModalTitle">Add New Role</h3><button class="modal-close" onclick="closeRoleModal()">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="roleId">
                <div class="form-group"><label>Role Name</label><input type="text" id="roleName" placeholder="e.g. Counsellor"></div>
                <div class="form-group"><label>Display Label</label><input type="text" id="roleLabel" placeholder="e.g. Academic Counsellor"></div>
                <div class="form-group"><label>Color</label><input type="color" id="roleColor" value="#ff6b00" style="height:45px;cursor:pointer;"></div>
                <div class="form-group">
                    <label>Permissions</label>
                    <div class="perm-grid" id="permGrid"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeRoleModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveRole()"><i class="fa fa-check"></i> Save Role</button>
            </div>
        </div>
    </div>

    <script src="/crm/js/data.js?v=3.5.0"></script>
    <script>
        // Auth
        if (localStorage.getItem('crm_logged_in') !== 'true') window.location.href='/crm/';
        const currentUser = CRM.getCurrentUser();
        if (!currentUser) { window.location.href='/crm/'; }
        function logout() { localStorage.removeItem('crm_logged_in'); localStorage.removeItem('crm_current_user'); window.location.href='/crm/'; }

        document.getElementById('topName').textContent = currentUser.name;
        document.getElementById('topRole').textContent = CRM.getUserRole(currentUser).label || currentUser.role;
        document.getElementById('topAvatar').textContent = CRM.getInitials(currentUser.name);

        // Build sidebar based on permissions
        const allModules = [
            { key:'dashboard', icon:'fa-th-large', label:'Dashboard', href:'/crm/dashboard', section:'Main' },
            { key:'leads', icon:'fa-users', label:'Leads', href:'/crm/leads', section:'Main' },
            { key:'applications', icon:'fa-file-text', label:'Applications', href:'/crm/applications', section:'Main' },
            { key:'enrollments', icon:'fa-graduation-cap', label:'Enrollments', href:'/crm/enrollments', section:'Main' },
            { key:'inquiries', icon:'fa-envelope', label:'Inquiries', href:'/crm/inquiries', section:'Communication' },
            { key:'subscribers', icon:'fa-bell', label:'Subscribers', href:'/crm/subscribers', section:'Communication' },
            { key:'fees', icon:'fa-credit-card', label:'Fee Management', href:'/crm/fees', section:'Financial' },
            { key:'users', icon:'fa-user-plus', label:'Users & Roles', href:'/crm/users', section:'Settings' },
            { key:'settings', icon:'fa-cog', label:'Settings', href:'/crm/settings', section:'Settings' },
        ];
        let navHTML = '';
        let lastSection = '';
        allModules.forEach(m => {
            if (CRM.hasPermission(currentUser, m.key)) {
                if (m.section !== lastSection) { navHTML += `<div class="nav-section-title">${m.section}</div>`; lastSection = m.section; }
                navHTML += `<a href="${m.href}"${m.key==='users'?' class="active"':''}><i class="fa ${m.icon}"></i> ${m.label}</a>`;
            }
        });
        navHTML += '<a href="../index.html"><i class="fa fa-globe"></i> View Website</a>';
        document.getElementById('sidebarNav').innerHTML = navHTML;

        // Check permission
        if (!CRM.hasPermission(currentUser, 'users')) {
            document.getElementById('pageContent').innerHTML = `<div class="access-denied"><i class="fa fa-lock"></i><h2>Access Denied</h2><p style="color:#6c757d;">You don't have permission to manage Users & Roles.<br>Contact the Owner or Admin for access.</p><a href="dashboard.html" class="btn btn-primary" style="margin-top:15px;"><i class="fa fa-arrow-left"></i> Back to Dashboard</a></div>`;
        } else {
            CRM.syncWithServer().then(() => renderPage());
        }

        const ALL_PERMISSIONS = [
            { key:'dashboard', label:'Dashboard' }, { key:'leads', label:'Leads' },
            { key:'applications', label:'Applications' }, { key:'enrollments', label:'Enrollments' },
            { key:'fees', label:'Fee Management' },
            { key:'inquiries', label:'Inquiries' }, { key:'subscribers', label:'Subscribers' },
            { key:'users', label:'Users & Roles' },
            { key:'settings', label:'Settings' },
        ];

        function renderPage() {
            document.getElementById('pageContent').innerHTML = `
                <div id="alertArea"></div>
                <div class="tab-nav">
                    <button class="active" onclick="switchTab('users',this)"><i class="fa fa-users" style="margin-right:6px;"></i> Users (${CRM.getAll('users').length})</button>
                    <button onclick="switchTab('roles',this)"><i class="fa fa-shield" style="margin-right:6px;"></i> Roles (${CRM.getAll('roles').length})</button>
                </div>
                <div id="usersTab" class="tab-content active"></div>
                <div id="rolesTab" class="tab-content"></div>
            `;
            renderUsers();
            renderRoles();
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-nav button').forEach(b=>b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(tab+'Tab').classList.add('active');
        }

        function renderUsers() {
            const users = CRM.getAll('users');
            document.getElementById('usersTab').innerHTML = `
                <div class="table-toolbar">
                    <div class="search-box"><i class="fa fa-search"></i><input type="text" placeholder="Search users..." oninput="filterUsers(this.value)"></div>
                    ${CRM.isOwner(currentUser) ? '<button class="btn btn-primary" onclick="openUserModal()"><i class="fa fa-plus"></i> Add User</button>' : ''}
                </div>
                <div class="card"><div class="card-body no-padding">
                    <table class="data-table"><thead><tr><th>User</th><th>Phone</th><th>Role</th><th>Status</th><th>Joined</th>${CRM.isOwner(currentUser)?'<th>Actions</th>':''}</tr></thead>
                    <tbody id="usersTableBody">${usersHTML(users)}</tbody></table>
                </div></div>
            `;
        }

        function usersHTML(users) {
            return users.map(u => `<tr>
                <td><div class="user-cell">
                    <div class="avatar" style="background:${CRM.getAvatarColor(u.name)}">${CRM.getInitials(u.name)}</div>
                    <div class="user-info"><div class="name">${u.name}${u.role==='owner'?' <i class="fa fa-star" style="color:#ffc107;font-size:12px;" title="Owner"></i>':''}</div><div class="email">${u.email}</div></div>
                </div></td>
                <td style="font-size:13px;">${u.phone || '-'}</td>
                <td>${CRM.getRoleBadge(u.role)}</td>
                <td><span class="badge ${u.status==='active'?'badge-success':'badge-danger'}">${u.status}</span></td>
                <td style="font-size:13px;color:#6c757d;">${CRM.formatDate(u.createdAt)}</td>
                ${CRM.isOwner(currentUser) ? `<td>
                    ${u.role!=='owner' ? `<button class="btn-icon" onclick="editUser(${u.id})" title="Edit"><i class="fa fa-pencil"></i></button>
                    <button class="btn-icon danger" onclick="deleteUser(${u.id})" title="Delete"><i class="fa fa-trash"></i></button>` : '<span style="font-size:12px;color:#adb5bd;">Protected</span>'}
                </td>` : ''}
            </tr>`).join('');
        }

        function filterUsers(q) {
            const users = CRM.getAll('users').filter(u => u.name.toLowerCase().includes(q.toLowerCase()) || u.email.toLowerCase().includes(q.toLowerCase()));
            document.getElementById('usersTableBody').innerHTML = usersHTML(users);
        }

        function renderRoles() {
            const roles = CRM.getAll('roles');
            document.getElementById('rolesTab').innerHTML = `
                ${CRM.isOwner(currentUser) ? '<div style="margin-bottom:20px;text-align:right;"><button class="btn btn-primary" onclick="openRoleModal()"><i class="fa fa-plus"></i> Add Role</button></div>' : ''}
                ${roles.map(r => `
                    <div class="role-card">
                        <div class="role-info">
                            <div class="role-dot" style="background:${r.color};"></div>
                            <div>
                                <div class="role-label">${r.label}</div>
                                <div class="role-perms">${r.permissions.includes('all') ? 'Full Access (All Permissions)' : r.permissions.join(', ')}</div>
                            </div>
                        </div>
                        <div>
                            <span style="font-size:13px;color:#6c757d;margin-right:15px;">${CRM.getAll('users').filter(u=>u.role===r.name).length} user(s)</span>
                            ${CRM.isOwner(currentUser) && r.name !== 'owner' ? `<button class="btn-icon" onclick="editRole(${r.id})" title="Edit"><i class="fa fa-pencil"></i></button> <button class="btn-icon danger" onclick="deleteRole(${r.id})" title="Delete"><i class="fa fa-trash"></i></button>` : ''}
                        </div>
                    </div>
                `).join('')}
            `;
        }

        // User Modal
        function openUserModal(user) {
            document.getElementById('userModalTitle').textContent = user ? 'Edit User' : 'Add New User';
            document.getElementById('userId').value = user ? user.id : '';
            document.getElementById('userName').value = user ? user.name : '';
            document.getElementById('userEmail').value = user ? user.email : '';
            document.getElementById('userPassword').value = '';
            document.getElementById('userPhone').value = user ? user.phone : '+91 ';
            document.getElementById('userStatus').value = user ? user.status : 'active';
            // Populate role dropdown
            const roles = CRM.getAll('roles').filter(r=>r.name!=='owner');
            document.getElementById('userRole').innerHTML = roles.map(r=>`<option value="${r.name}" ${user&&user.role===r.name?'selected':''}>${r.label}</option>`).join('');
            document.getElementById('userModal').classList.add('active');
        }
        function closeUserModal() { document.getElementById('userModal').classList.remove('active'); }

        function saveUser() {
            const id = document.getElementById('userId').value;
            const data = {
                name: document.getElementById('userName').value,
                email: document.getElementById('userEmail').value,
                phone: document.getElementById('userPhone').value,
                role: document.getElementById('userRole').value,
                status: document.getElementById('userStatus').value,
            };
            if (!data.name || !data.email) { alert('Name and Email are required.'); return; }
            const pw = document.getElementById('userPassword').value;

            if (id) {
                if (pw) data.password = pw;
                CRM.update('users', parseInt(id), data);
                showAlert('User updated successfully!', 'success');
            } else {
                if (!pw || pw.length < 6) { alert('Password must be at least 6 characters.'); return; }
                // Check duplicate email
                if (CRM.getAll('users').find(u=>u.email===data.email)) { alert('A user with this email already exists.'); return; }
                data.password = pw;
                data.createdAt = new Date().toISOString().split('T')[0];
                CRM.add('users', data);
                showAlert('New user created successfully!', 'success');
            }
            closeUserModal();
            renderPage();
        }

        function editUser(id) { openUserModal(CRM.getById('users', id)); }
        function deleteUser(id) {
            const u = CRM.getById('users', id);
            if (u.role === 'owner') { alert('Cannot delete the Owner account.'); return; }
            if (confirm('Delete user "' + u.name + '"? They will no longer be able to log in.')) {
                CRM.remove('users', id);
                showAlert('User deleted.', 'danger');
                renderPage();
            }
        }

        // Role Modal
        function openRoleModal(role) {
            document.getElementById('roleModalTitle').textContent = role ? 'Edit Role' : 'Add New Role';
            document.getElementById('roleId').value = role ? role.id : '';
            document.getElementById('roleName').value = role ? role.name : '';
            document.getElementById('roleLabel').value = role ? role.label : '';
            document.getElementById('roleColor').value = role ? role.color : '#ff6b00';
            const perms = role ? role.permissions : [];
            document.getElementById('permGrid').innerHTML = ALL_PERMISSIONS.map(p => `
                <label class="perm-checkbox"><input type="checkbox" value="${p.key}" ${perms.includes(p.key)||perms.includes('all')?'checked':''}> ${p.label}</label>
            `).join('');
            document.getElementById('roleModal').classList.add('active');
        }
        function closeRoleModal() { document.getElementById('roleModal').classList.remove('active'); }

        function saveRole() {
            const id = document.getElementById('roleId').value;
            const name = document.getElementById('roleName').value.toLowerCase().replace(/\s+/g,'-');
            const label = document.getElementById('roleLabel').value;
            const color = document.getElementById('roleColor').value;
            const permissions = Array.from(document.querySelectorAll('#permGrid input:checked')).map(c=>c.value);
            if (!name || !label) { alert('Role name and label are required.'); return; }
            if (id) {
                CRM.update('roles', parseInt(id), { name, label, color, permissions });
                showAlert('Role updated!', 'success');
            } else {
                if (CRM.getAll('roles').find(r=>r.name===name)) { alert('A role with this name already exists.'); return; }
                CRM.add('roles', { name, label, color, permissions });
                showAlert('New role created!', 'success');
            }
            closeRoleModal();
            renderPage();
        }

        function editRole(id) { openRoleModal(CRM.getById('roles', id)); }
        function deleteRole(id) {
            const r = CRM.getById('roles', id);
            const usersWithRole = CRM.getAll('users').filter(u=>u.role===r.name);
            if (usersWithRole.length > 0) { alert('Cannot delete role "'+r.label+'" — '+usersWithRole.length+' user(s) assigned. Reassign them first.'); return; }
            if (confirm('Delete role "'+r.label+'"?')) { CRM.remove('roles', id); showAlert('Role deleted.','danger'); renderPage(); }
        }

        function showAlert(msg, type) {
            document.getElementById('alertArea').innerHTML = `<div class="alert alert-${type}"><i class="fa fa-${type==='success'?'check-circle':'exclamation-circle'}"></i> ${msg}</div>`;
            setTimeout(()=>document.getElementById('alertArea').innerHTML='',3000);
        }
    
        // Multi-device real-time sync listener
        window.addEventListener('crm:synced', () => {
            if (typeof renderPage === "function") renderPage();
        });
</script>
</body>
</html>
